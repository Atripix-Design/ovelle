name: Select CI runners

on:
  workflow_call:
    inputs:
      desired_slots:
        description: Number of priority lanes to route
        required: true
        type: number
      trusted:
        description: Whether the caller has classified the event as trusted
        required: true
        type: boolean
      force_hosted:
        description: Force every lane onto GitHub-hosted infrastructure
        required: false
        default: false
        type: boolean
      lane_names_json:
        description: Ordered JSON array of lane names
        required: true
        type: string
      runner_app_id:
        description: GitHub App ID used only to inspect organization runners
        required: true
        type: string
    secrets:
      runner_app_private_key:
        required: true
    outputs:
      slot_1:
        value: ${{ jobs.select.outputs.slot_1 }}
      slot_2:
        value: ${{ jobs.select.outputs.slot_2 }}
      slot_3:
        value: ${{ jobs.select.outputs.slot_3 }}
      local_slots_json:
        value: ${{ jobs.select.outputs.local_slots_json }}
      local_slot_count:
        value: ${{ jobs.select.outputs.local_slot_count }}
      allocation_summary:
        value: ${{ jobs.select.outputs.allocation_summary }}

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      slot_1: ${{ steps.route.outputs.slot_1 }}
      slot_2: ${{ steps.route.outputs.slot_2 }}
      slot_3: ${{ steps.route.outputs.slot_3 }}
      local_slots_json: ${{ steps.route.outputs.local_slots_json }}
      local_slot_count: ${{ steps.route.outputs.local_slot_count }}
      allocation_summary: ${{ steps.route.outputs.allocation_summary }}
    steps:
      - name: Select available capacity
        id: route
        shell: bash
        env:
          APP_ID: ${{ inputs.runner_app_id }}
          APP_PRIVATE_KEY: ${{ secrets.runner_app_private_key }}
          DESIRED_SLOTS: ${{ inputs.desired_slots }}
          FORCE_HOSTED: ${{ inputs.force_hosted }}
          LANE_NAMES_JSON: ${{ inputs.lane_names_json }}
          ORGANIZATION: ${{ github.repository_owner }}
          CALLER_WORKFLOW: ${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}
          REPOSITORY_ID: ${{ github.repository_id }}
          TRUSTED: ${{ inputs.trusted }}
        run: |
          set -uo pipefail

          hosted='"ubuntu-latest"'
          emit_hosted() {
            local reason="$1"
            local lanes
            lanes="$(jq -r 'map(. + "=hosted") | join(", ")' <<<"$LANE_NAMES_JSON" 2>/dev/null || printf 'all=hosted')"
            echo "::notice title=Atripix runner allocation::$lanes ($reason)"
            {
              echo "slot_1=$hosted"
              echo "slot_2=$hosted"
              echo "slot_3=$hosted"
              echo 'local_slots_json=[]'
              echo 'local_slot_count=0'
              echo "allocation_summary=$lanes ($reason)"
            } >>"$GITHUB_OUTPUT"
          }

          if ! [[ "$DESIRED_SLOTS" =~ ^[1-3]$ ]]; then
            emit_hosted "invalid desired_slots"
            exit 0
          fi
          if ! jq -e --argjson count "$DESIRED_SLOTS" 'type == "array" and length == $count and all(.[]; type == "string" and length > 0)' <<<"$LANE_NAMES_JSON" >/dev/null; then
            emit_hosted "invalid lane_names_json"
            exit 0
          fi
          if [[ "$FORCE_HOSTED" == "true" ]]; then
            emit_hosted "forced"
            exit 0
          fi
          if [[ "$TRUSTED" != "true" ]]; then
            emit_hosted "untrusted"
            exit 0
          fi

          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"
          header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)"
          payload="$(jq -cn --argjson iat "$((now - 60))" --argjson exp "$((now + 540))" --arg iss "$APP_ID" '{iat:$iat,exp:$exp,iss:$iss}' | b64url)"
          unsigned="$header.$payload"
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$APP_PRIVATE_KEY" >"$key_file"
          signature="$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key_file" -binary 2>/dev/null | b64url)"
          jwt="$unsigned.$signature"

          api_headers=(
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2022-11-28'
          )
          installation="$(curl --fail-with-body --silent --show-error "${api_headers[@]}" -H "Authorization: Bearer $jwt" "https://api.github.com/orgs/$ORGANIZATION/installation" 2>/dev/null)" || {
            emit_hosted "GitHub App authentication failed"
            exit 0
          }
          installation_id="$(jq -er '.id' <<<"$installation" 2>/dev/null)" || {
            emit_hosted "GitHub App installation missing"
            exit 0
          }
          token_response="$(curl --fail-with-body --silent --show-error -X POST "${api_headers[@]}" -H "Authorization: Bearer $jwt" "https://api.github.com/app/installations/$installation_id/access_tokens" 2>/dev/null)" || {
            emit_hosted "installation token failed"
            exit 0
          }
          token="$(jq -er '.token' <<<"$token_response" 2>/dev/null)" || {
            emit_hosted "installation token invalid"
            exit 0
          }
          # Public adapter: require explicit access before assigning any local lane.
          # Never queue work on a runner group that cannot accept this repository.
          echo "::add-mask::$token"
          groups="$(curl --fail-with-body --silent --show-error "${api_headers[@]}" -H "Authorization: Bearer $token" "https://api.github.com/orgs/$ORGANIZATION/actions/runner-groups?per_page=100" 2>/dev/null)" || {
            emit_hosted "runner group access unavailable"
            exit 0
          }
          group="$(jq -ec --arg workflow "$CALLER_WORKFLOW" '[.runner_groups[] | select(.name == "atripix-private-builders" and .allows_public_repositories == true and .visibility == "selected" and .restricted_to_workflows == true and ((.selected_workflows // []) | index($workflow) != null))] | if length == 1 then .[0] else error("no eligible group") end' <<<"$groups" 2>/dev/null)" || {
            emit_hosted "public repository or trusted workflow not enabled for the selected runner group"
            exit 0
          }
          group_id="$(jq -er '.id' <<<"$group")"
          repositories="$(curl --fail-with-body --silent --show-error "${api_headers[@]}" -H "Authorization: Bearer $token" "https://api.github.com/orgs/$ORGANIZATION/actions/runner-groups/$group_id/repositories?per_page=100" 2>/dev/null)" || {
            emit_hosted "repository access unavailable"
            exit 0
          }
          if ! jq -e --argjson repository_id "$REPOSITORY_ID" 'any(.repositories[]; .id == $repository_id)' <<<"$repositories" >/dev/null; then
            emit_hosted "repository not selected for the runner group"
            exit 0
          fi
          runners="$(curl --fail-with-body --silent --show-error "${api_headers[@]}" -H "Authorization: Bearer $token" "https://api.github.com/orgs/$ORGANIZATION/actions/runner-groups/$group_id/runners?per_page=100" 2>/dev/null)" || {
            emit_hosted "runner inventory unavailable"
            exit 0
          }

          idle="$(jq -er '[.runners[] | select(
            .status == "online" and
            .busy == false and
            (.ephemeral == true or .ephemeral == null) and
            (.name | startswith("atripix-jit-")) and
            ([.labels[].name | ascii_downcase] | index("self-hosted") != null) and
            ([.labels[].name | ascii_downcase] | index("linux") != null) and
            ([.labels[].name | ascii_downcase] | index("x64") != null) and
            ([.labels[].name | ascii_downcase] | index("atripix-build") != null) and
            ([.labels[].name | ascii_downcase] | index("atripix-ephemeral") != null)
          )] | length' <<<"$runners" 2>/dev/null)" || {
            emit_hosted "invalid runner inventory"
            exit 0
          }
          local_count="$((idle < DESIRED_SLOTS ? idle : DESIRED_SLOTS))"
          local_runner='["self-hosted","linux","x64","atripix-build","atripix-ephemeral"]'
          slots=("$hosted" "$hosted" "$hosted")
          local_slots='[]'
          for ((index = 0; index < local_count; index += 1)); do
            slots[$index]="$local_runner"
            local_slots="$(jq -c --argjson slot "$((index + 1))" '. + [$slot]' <<<"$local_slots")"
          done
          summary="$(jq -r --argjson count "$local_count" 'to_entries | map(.value + "=" + (if .key < $count then "local" else "hosted" end)) | join(", ")' <<<"$LANE_NAMES_JSON")"
          echo "::notice title=Atripix runner allocation::$summary (eligible runners: $idle)"
          {
            echo "slot_1=${slots[0]}"
            echo "slot_2=${slots[1]}"
            echo "slot_3=${slots[2]}"
            echo "local_slots_json=$local_slots"
            echo "local_slot_count=$local_count"
            echo "allocation_summary=$summary"
          } >>"$GITHUB_OUTPUT"
