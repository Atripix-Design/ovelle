name: Ovelle CI/CD

on:
  pull_request:
  push:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on:
      group: atripix-private-builders
      labels: [self-hosted, linux, x64, atripix-build, atripix-ephemeral]
    timeout-minutes: 20
    outputs:
      package_artifact_id: ${{ steps.packages.outputs.artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-node-adaptive
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Packaging is secret-free; keep it in the already allocated build slot.
      - name: Prepare packaging tools without root
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zip >/dev/null; then
            tools_dir="$(mktemp -d "$RUNNER_TEMP/ovelle-package-tools.XXXXXX")"
            cd "$tools_dir"
            mkdir -p "$tools_dir/lists/partial"
            apt_options=(-o "Dir::State::lists=$tools_dir/lists" -o "APT::Sandbox::User=$(id -un)")
            apt-get "${apt_options[@]}" update
            apt-get "${apt_options[@]}" download zip libbz2-1.0
            for package in ./*.deb; do dpkg-deb -x "$package" "$tools_dir/root"; done
            echo "$tools_dir/root/usr/bin" >> "$GITHUB_PATH"
            echo "LD_LIBRARY_PATH=$tools_dir/root/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          fi
      - name: Package desktop applications
        if: github.event_name == 'push'
        env:
          VITE_RELEASE_SHA: ${{ github.sha }}
        run: npm run package:all -w @ovelle/desktop
      - name: Verify local packages
        if: github.event_name == 'push'
        run: node scripts/verify-desktop-releases.mjs local
      - name: Transfer packages to isolated delivery
        if: github.event_name == 'push'
        id: packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-packages-${{ github.run_attempt }}
          path: |
            release/desktop/Ovelle-*-mac-x64.zip
            release/desktop/Ovelle-*-mac-arm64.zip
            release/desktop/Ovelle-*-win-x64.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  typecheck:
    name: typecheck
    runs-on:
      group: atripix-private-builders
      labels: [self-hosted, linux, x64, atripix-build, atripix-ephemeral]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-node-adaptive
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @ovelle/ui
      - run: npm run check
      - run: npm run check:download-email
      - run: npm run test:stage0
      - run: node scripts/check-repository-privacy.mjs
      - run: npm run check:ci

  lint:
    name: lint
    runs-on:
      group: atripix-private-builders
      labels: [self-hosted, linux, x64, atripix-build, atripix-ephemeral]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-node-adaptive
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  saml-browser:
    name: Identity browser acceptance
    runs-on:
      group: atripix-private-builders
      labels: [self-hosted, linux, x64, atripix-build, atripix-ephemeral, atripix-browser]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-node-adaptive
        with:
          node-version: 22.12.0
          cache: npm
      - run: node --version
      - run: npm ci
      - run: npx playwright install chromium firefox webkit
      - run: node --test scripts/stage0-browser-proxy.test.mjs
      - run: npm run test:stage0-saml-browser
      - run: npm run test:stage0-oidc-browser
      - run: npm run test:stage0-passkey-browser

  # Dedicated secret-bearing capacity is required; missing capacity blocks delivery.
  deploy:
    name: Deploy application
    needs: [build, typecheck, lint, saml-browser]
    if: >-
      ${{ github.actor != 'dependabot[bot]' &&
        github.event_name == 'push' &&
        (github.ref == 'refs/heads/development' ||
         github.ref == 'refs/heads/main') }}
    runs-on:
      group: atripix-ovelle-publishers
      labels: [self-hosted, linux, x64, ovelle-publish, atripix-ephemeral]
    timeout-minutes: 45
    permissions:
      contents: read
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    concurrency:
      group: delivery-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-node-adaptive
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/setup-github-cli
      - name: Verify current branch source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_SOURCE_EVENT: ${{ github.event_name }}
          DELIVERY_SOURCE_SHA: ${{ github.sha }}
          DELIVERY_SOURCE_REF: ${{ github.ref }}
        run: node scripts/ci/verify-delivery-source.mjs
      - run: npm ci
      - run: npm run build -w @ovelle/ui
      - name: Receive packages from the build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-packages-${{ github.run_attempt }}
          path: release/desktop
      - name: Verify local packages
        env:
          OVELLE_RELEASE_DIR: release/desktop
        run: node scripts/verify-desktop-releases.mjs local
      - name: Build website
        env:
          VITE_RELEASE_SHA: ${{ github.sha }}
          APP_ENV: ${{ steps.source.outputs.environment }}
        run: |
          if [ "$APP_ENV" = development ]; then
            npm run build:development -w @ovelle/web
          else
            npm run build -w @ovelle/web
          fi
      - name: Recheck branch before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_SOURCE_EVENT: ${{ github.event_name }}
          DELIVERY_SOURCE_SHA: ${{ github.sha }}
          DELIVERY_SOURCE_REF: ${{ github.ref }}
        run: node scripts/ci/verify-delivery-source.mjs
      - name: Upload packages and deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APP_ENV: ${{ steps.source.outputs.environment }}
        run: node scripts/ci/deliver.mjs "$APP_ENV"
      - name: Verify deployed downloads
        env:
          OVELLE_RELEASE_DIR: release/desktop
          APP_ENV: ${{ steps.source.outputs.environment }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-desktop-releases.mjs "$APP_ENV"

  # Remove transfer storage even when a check or deployment fails. One-day
  # retention bounds leftovers if a cancellation prevents cleanup from starting.
  cleanup-packages:
    needs: [build, typecheck, lint, deploy]
    if: ${{ always() && needs.build.outputs.package_artifact_id != '' }}
    runs-on:
      group: atripix-ovelle-publishers
      labels: [self-hosted, linux, x64, ovelle-publish, atripix-ephemeral]
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-github-cli
      - name: Delete temporary package transfer
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.package_artifact_id }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
