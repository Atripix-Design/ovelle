name: Dispatch hosted CI fallback
description: Replays a workflow on GitHub-hosted runners while preserving source metadata
inputs:
  github-token:
    description: Caller GITHUB_TOKEN with Actions write permission
    required: true
  workflow-file:
    required: true
  dispatch-ref:
    required: true
  force-hosted:
    required: false
    default: "false"
  source-event:
    required: true
  source-sha:
    required: true
  source-ref:
    required: true
  pull-request-number:
    required: false
    default: ""
  pull-request-base:
    required: false
    default: ""
  fallback-inputs-json:
    required: false
    default: "{}"
runs:
  using: composite
  steps:
    - name: Dispatch forced-hosted replay
      if: inputs.force-hosted != 'true'
      shell: bash
      env:
        DISPATCH_REF: ${{ inputs.dispatch-ref }}
        FALLBACK_INPUTS_JSON: ${{ inputs.fallback-inputs-json }}
        GH_TOKEN: ${{ inputs.github-token }}
        PR_BASE: ${{ inputs.pull-request-base }}
        PR_NUMBER: ${{ inputs.pull-request-number }}
        REPOSITORY: ${{ github.repository }}
        SOURCE_EVENT: ${{ inputs.source-event }}
        SOURCE_REF: ${{ inputs.source-ref }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
      run: |
        set -euo pipefail
        if ! [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
          echo "source-sha must be a full 40-character commit SHA" >&2
          exit 64
        fi
        inputs="$(jq -c \
          --arg source_event "$SOURCE_EVENT" \
          --arg source_sha "$SOURCE_SHA" \
          --arg source_ref "$SOURCE_REF" \
          --arg dispatch_ref "$DISPATCH_REF" \
          --arg pull_request_number "$PR_NUMBER" \
          --arg pull_request_base "$PR_BASE" \
          '. + {
            force_hosted:"true",
            source_event:$source_event,
            source_sha:$source_sha,
            source_ref:$source_ref,
            dispatch_ref:$dispatch_ref,
            pull_request_number:$pull_request_number,
            pull_request_base:$pull_request_base
          }' <<<"$FALLBACK_INPUTS_JSON")"
        body="$(jq -cn --arg ref "$DISPATCH_REF" --argjson inputs "$inputs" '{ref:$ref,inputs:$inputs}')"
        curl --fail-with-body --silent --show-error -X POST \
          -H 'Accept: application/vnd.github+json' \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H 'X-GitHub-Api-Version: 2022-11-28' \
          "https://api.github.com/repos/$REPOSITORY/actions/workflows/$WORKFLOW_FILE/dispatches" \
          --data "$body"
