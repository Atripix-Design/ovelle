name: Set up pinned GitHub CLI
description: Install a checksum-verified Linux x64 CLI inside the disposable job without privilege.
runs:
  using: composite
  steps:
    - name: Install GitHub CLI 2.103.2
      shell: bash
      run: |
        set -euo pipefail
        test "$RUNNER_OS" = Linux
        test "$RUNNER_ARCH" = X64
        cli_root="$(mktemp -d "$RUNNER_TEMP/atripix-gh-XXXXXX")"
        cli_archive="$cli_root/gh.tar.gz"
        curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 https://github.com/cli/cli/releases/download/v2.103.2/gh_2.103.2_linux_amd64.tar.gz --output "$cli_archive"
        echo "62ccf747115ddc61237efffdde66a3c8f70ba249433dc64f70801089b59c59c8  $cli_archive" | sha256sum --check --status
        tar --extract --gzip --file "$cli_archive" --directory "$cli_root" --strip-components=1
        rm "$cli_archive"
        "$cli_root/bin/gh" --version
        echo "$cli_root/bin" >> "$GITHUB_PATH"
