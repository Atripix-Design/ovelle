name: Adaptive Node setup
description: Uses the isolated self-hosted Node tool-cache without a shared package cache.

inputs:
  node-version:
    description: Node.js version accepted by actions/setup-node.
    required: true
  cache:
    description: Retained for caller compatibility; shared package caching is disabled.
    required: false
    default: npm
  cache-dependency-path:
    description: Retained for caller compatibility; unused.
    required: false

runs:
  using: composite
  steps:
    - name: Require self-hosted execution
      shell: bash
      env:
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
      run: test "$RUNNER_ENVIRONMENT" = self-hosted
    - name: Set up Node from the self-hosted tool-cache
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ inputs.node-version }}
